services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CLOUD_MONGO: "0"
      MONGO_URI: mongodb://mongo:27017/
      AUTH_BYPASS: "${AUTH_BYPASS:-0}" # use inline env vars and set this to 1 to disable security
    depends_on:
      mongo:
        condition: service_healthy
      mariadb:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  mariadb:
    image: mariadb
    environment:
      MARIADB_DATABASE: "cfaang"
      MARIADB_USER: "admin"
      MARIADB_PASSWORD: "admin"
      MARIADB_ROOT_PASSWORD: "admin"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mongo_data:
  mariadb_data: