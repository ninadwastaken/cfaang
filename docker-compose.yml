services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CLOUD_MONGO: "0"
      MONGO_URI: mongodb://mongo:27017/
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mongo_data: